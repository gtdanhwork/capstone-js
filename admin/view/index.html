<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Phone Shop - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/main.css"></head>
<body class="admin-page"><div class="container-fluid"><div class="row"><aside class="col-lg-2 admin-sidebar p-3"><a href="../../index.html" class="d-block fs-4 fw-bold text-white mb-4">📱 Phone Shop</a><a class="active" href="#"><i class="fa-solid fa-box me-2"></i>Sản phẩm</a><a href="../../customer/view/index.html"><i class="fa-solid fa-store me-2"></i>Trang bán hàng</a></aside>
<main class="col-lg-10 admin-main"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 class="fw-bold mb-1">Quản lý sản phẩm</h1><p class="text-secondary mb-0">CRUD sản phẩm bằng Axios, validation, tìm kiếm và sắp xếp.</p></div><button id="btnOpenAdd" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal"><i class="fa-solid fa-plus me-2"></i>Thêm sản phẩm</button></div>
<div class="row g-3 mb-4"><div class="col-md-4"><div class="stat-card"><span class="text-secondary">Tổng sản phẩm</span><div id="totalProducts" class="display-6 fw-bold">0</div></div></div><div class="col-md-4"><div class="stat-card"><span class="text-secondary">Samsung</span><div id="samsungCount" class="display-6 fw-bold text-primary">0</div></div></div><div class="col-md-4"><div class="stat-card"><span class="text-secondary">iPhone</span><div id="iphoneCount" class="display-6 fw-bold">0</div></div></div></div>
<div class="admin-table-wrap"><div class="p-3 border-bottom"><div class="row g-2"><div class="col-md-6"><div class="input-group"><span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span><input id="searchName" class="form-control" placeholder="Tìm theo tên..."></div></div><div class="col-md-4"><select id="sortPrice" class="form-select"><option value="">Sắp xếp giá</option><option value="asc">Giá thấp → cao</option><option value="desc">Giá cao → thấp</option></select></div><div class="col-md-2"><button id="btnResetFilter" class="btn btn-outline-secondary w-100">Đặt lại</button></div></div></div>
<div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Ảnh</th><th>Tên</th><th>Loại</th><th>Giá</th><th>Mô tả</th><th>Thao tác</th></tr></thead><tbody id="productTableBody"></tbody></table></div></div></main></div></div>
<div class="modal fade" id="productModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><form id="productForm"><div class="modal-header"><h5 id="modalTitle" class="modal-title">Thêm sản phẩm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3">
<div class="col-md-8"><label class="form-label">Tên sản phẩm *</label><input id="productName" class="form-control"><span id="errorName" class="validation-message"></span></div><div class="col-md-4"><label class="form-label">Giá *</label><input id="productPrice" type="number" min="1" class="form-control"><span id="errorPrice" class="validation-message"></span></div>
<div class="col-md-6"><label class="form-label">Loại *</label><select id="productType" class="form-select"><option value="">-- Chọn --</option><option value="samsung">Samsung</option><option value="iphone">iPhone</option></select><span id="errorType" class="validation-message"></span></div><div class="col-md-6"><label class="form-label">Link ảnh *</label><input id="productImage" class="form-control"><span id="errorImg" class="validation-message"></span></div>
<div class="col-md-4"><label class="form-label">Màn hình</label><input id="productScreen" class="form-control"></div><div class="col-md-4"><label class="form-label">Camera sau</label><input id="productBackCamera" class="form-control"></div><div class="col-md-4"><label class="form-label">Camera trước</label><input id="productFrontCamera" class="form-control"></div><div class="col-12"><label class="form-label">Mô tả</label><textarea id="productDesc" class="form-control" rows="3"></textarea></div>
</div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button><button id="btnSaveProduct" type="submit" class="btn btn-primary">Thêm sản phẩm</button></div></form></div></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast text-bg-success"><div class="d-flex"><div id="toastBody" class="toast-body"></div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="../controller/main.js"></script></body></html>
